<svg xmlns="http://www.w3.org/2000/svg" width="800" height="790" viewBox="0 0 800 790" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise, organizations, and two different kinds of team</title>
  <desc id="desc">A top-down ownership tree. The enterprise contains a Platform organization, an Apps organization, and enterprise teams. Each organization owns repositories and organization teams. Platform also owns the selected .github-private governance repository. Enterprise teams group users across organizations, rather than sitting beneath an organization team.</desc>
  <defs>
    <style>
      .bg { fill: #f5f8fc; }
      .blue { fill: #e8f1ff; stroke: #3973c6; stroke-width: 2; }
      .green { fill: #e8f7f1; stroke: #31856b; stroke-width: 2; }
      .purple { fill: #f4f0ff; stroke: #8162c3; stroke-width: 2; }
      .white { fill: #ffffff; stroke: #b8c7d9; stroke-width: 2; }
      .line { fill: none; stroke: #50677f; stroke-width: 3; }
      .title { font: 700 30px Arial, sans-serif; fill: #000000; }
      .label { font: 700 24px Arial, sans-serif; fill: #000000; text-anchor: middle; }
      .body { font: 22px Arial, sans-serif; fill: #000000; text-anchor: middle; }
      .note { font: 22px Arial, sans-serif; fill: #000000; }
    </style>
  </defs>
  <rect class="bg" width="800" height="790" rx="20"/>
  <text class="title" x="30" y="48">Who owns what?</text>
  <rect class="blue" x="240" y="85" width="320" height="85" rx="12"/>
  <text class="label" x="400" y="121">Enterprise</text>
  <text class="body" x="400" y="152">GitHub Enterprise Cloud</text>

  <path class="line" d="M400 170 V205 M140 205 H660 M140 205 V245 M400 205 V245 M660 205 V245"/>
  <rect class="blue" x="30" y="245" width="220" height="85" rx="12"/>
  <text class="label" x="140" y="282">Platform</text>
  <text class="body" x="140" y="312">Organization</text>
  <rect class="blue" x="290" y="245" width="220" height="85" rx="12"/>
  <text class="label" x="400" y="282">Apps</text>
  <text class="body" x="400" y="312">Organization</text>
  <rect class="purple" x="550" y="245" width="220" height="85" rx="12"/>
  <text class="label" x="660" y="282">Enterprise teams</text>
  <text class="body" x="660" y="312">Cross-org groups</text>

  <path class="line" d="M140 330 V365 M400 330 V365"/>
  <rect class="white" x="30" y="365" width="220" height="75" rx="12"/>
  <text class="label" x="140" y="396">Org teams</text>
  <text class="body" x="140" y="425">Platform members</text>
  <rect class="white" x="290" y="365" width="220" height="75" rx="12"/>
  <text class="label" x="400" y="396">Org teams</text>
  <text class="body" x="400" y="425">Apps members</text>

  <path class="line" d="M30 288 H15 V585 H30 M290 288 H275 V505 H290 M15 505 H30"/>
  <rect class="green" x="30" y="470" width="220" height="70" rx="12"/>
  <text class="label" x="140" y="512">Repositories</text>
  <rect class="green" x="290" y="470" width="220" height="70" rx="12"/>
  <text class="label" x="400" y="512">Repositories</text>
  <rect class="green" x="30" y="560" width="220" height="80" rx="12"/>
  <text class="label" x="140" y="592">.github-private</text>
  <text class="body" x="140" y="623">Governance repo</text>

  <text class="body" x="660" y="384">Example: plugin pilot</text>
  <text class="body" x="660" y="427">Can include users</text>
  <text class="body" x="660" y="457">from both orgs.</text>
  <text class="body" x="660" y="510">Not a child of</text>
  <text class="body" x="660" y="540">an org team.</text>

  <text class="note" x="285" y="590">Selected in enterprise AI Controls</text>
  <text class="note" x="285" y="622">to supply the central policy.</text>
  <path class="line" d="M250 600 H272"/>
  <text class="note" x="30" y="702">Lines show ownership, not policy inheritance.</text>
  <text class="note" x="30" y="739">Enterprise policy targets covered users across organizations.</text>
</svg>
