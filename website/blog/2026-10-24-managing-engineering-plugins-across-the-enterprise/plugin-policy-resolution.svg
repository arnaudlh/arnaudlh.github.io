<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="615" viewBox="0 0 1100 615" role="img" aria-labelledby="title desc">
<title id="title">One baseline. A targeted plugin pilot.</title><desc id="desc">The enterprise baseline lists the Git-Ape marketplace without requiring the plugin. A mapped enterprise-team file adds the Git-Ape requirement for pilot members only. Other users receive no requirement from this pilot. After validation, move the requirement to the enterprise baseline. Team and local settings cannot weaken an enterprise plugin requirement.</desc>
