<title id="title">Prove the policy before promotion</title><desc id="desc">Validate the selected configuration source, compare pilot and non-pilot accounts, verify that a conflicting local disable is rejected, and run a read-only skill task in each supported client. Clean repositories help distinguish managed enforcement from repository defaults. Promote the requirement only after the client checks pass.</desc>
