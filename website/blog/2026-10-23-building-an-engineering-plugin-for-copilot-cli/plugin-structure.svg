<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
  <title id="title">Build the toolkit your workflow needs</title>
  <desc id="desc">An engineering plugin packages portable skills and MCP configuration, plus optional client-specific components. Custom agents, commands, rules, hooks, language servers, automation templates, and executable extensions depend on the client. Canvas extensions need a supporting app or harness, including the Copilot app and supported VS Code Copilot sessions.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #000000; }
    .title { font-size: 30px; font-weight: 700; }
    .label { font-size: 24px; font-weight: 700; }
    .body { font-size: 20px; }
    .note { font-size: 18px; }
  </style>
  <rect width="1000" height="630" rx="22" fill="#f5f8fc"/>
  <text class="title" x="35" y="52">Build the toolkit your workflow needs</text>
  <text class="body" x="35" y="87">plugin.json describes the package and its format.</text>
  <rect x="30" y="115" width="450" height="350" rx="16" fill="none" stroke="#3973c6" stroke-width="2"/>
  <text class="label" x="50" y="153">Portable core</text>
  <text class="note" x="50" y="184">Agent Plugins 1.0</text>
  <rect x="50" y="210" width="410" height="100" rx="12" fill="#e8f1ff" stroke="#3973c6"/>
  <text class="label" x="70" y="248">Skills</text>
  <text class="body" x="70" y="281">Instructions, scripts, references</text>
  <rect x="50" y="330" width="410" height="100" rx="12" fill="#e8f1ff" stroke="#3973c6"/>
  <text class="label" x="70" y="368">MCP configuration</text>
  <text class="body" x="70" y="401">Connections to tools and services</text>
  <rect x="510" y="115" width="460" height="350" rx="16" fill="none" stroke="#8162c3" stroke-width="2"/>
  <text class="label" x="530" y="153">Client-specific additions</text>
  <text class="note" x="530" y="184">Check the client's format and runtime</text>
  <rect x="530" y="210" width="420" height="100" rx="12" fill="#f4f0ff" stroke="#8162c3"/>
  <text class="label" x="550" y="248">Agents, commands, rules</text>
  <text class="body" x="550" y="281">Hooks, LSP, automation templates</text>
  <rect x="530" y="330" width="420" height="100" rx="12" fill="#f4f0ff" stroke="#8162c3"/>
  <text class="label" x="550" y="368">Extensions</text>
  <text class="body" x="550" y="401">Canvases in app / Copilot VS Code</text>
  <rect x="30" y="495" width="940" height="75" rx="12" fill="#e8f7f1" stroke="#31856b"/>
  <text class="label" x="50" y="526">Example: a release toolkit</text>
  <text class="body" x="50" y="553">Release-notes skill + issue tracker + reviewer agent + checklist canvas</text>
  <text class="note" x="35" y="605">Choose the components you need; verify each one in its intended client.</text>
</svg>
