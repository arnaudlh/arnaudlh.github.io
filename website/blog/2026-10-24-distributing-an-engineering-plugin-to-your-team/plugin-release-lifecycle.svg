<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="485" viewBox="0 0 1100 485" role="img" aria-labelledby="title desc">
<title id="title">Ship a release with a way back</title><desc id="desc">Review and evaluate the plugin, publish a versioned revision, refresh the marketplace and installed package, then verify loaded components and a low-risk task. A version rollback restores an earlier reviewed source revision. Disabling a plugin does not restore an older version.</desc>
