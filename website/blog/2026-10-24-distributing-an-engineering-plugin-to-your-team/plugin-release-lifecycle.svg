<text x="471" y="390" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#000000">Rollback: restore a reviewed revision</text>
<text x="42" y="449" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#000000">Disabling stops use. Restoring an earlier source revision changes the installed release.</text>
