<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
<title id="title">From one plugin to the whole team</title><desc id="desc">A plugin package is listed in a Git marketplace catalog. Engineers browse and install it in CLI, VS Code, and the Copilot app. Components and prerequisites must be checked in each client; adding a catalog alone does not install plugins.</desc>
