<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Two questions, two kinds of evidence</title><desc id="desc">Availability and a plausible answer do not establish invocation. 1. Was the skill selected?. Use a natural request without naming the skill.. Inspect loading events or invocation records.. Record unavailable evidence as unverified.. 2. Did the procedure work?. Explicitly request the skill when debugging.. Check plan citations, impact, and missing input.. Inspect the response and execution trace.. A trigger heuristic checks relevance. Record actual loading evidence separately.</desc>
<rect width="1100" height="420" rx="22" fill="#f5f8fc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#000000">
<text x="42" y="52" font-size="29" font-weight="700">Two questions, two kinds of evidence</text>
<text x="42" y="87" font-size="18" font-weight="400">Availability and a plausible answer do not establish invocation.</text>
<rect x="42" y="119" width="497" height="213" rx="14" fill="none" stroke="#1864ab" stroke-width="2"/>
<polyline points="67,140 67,166" fill="none" stroke="#1864ab" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="67,153 88,153 88,142" fill="none" stroke="#1864ab" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="83,146 88,141 93,146" fill="none" stroke="#1864ab" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="83,161 88,166 93,161" fill="none" stroke="#1864ab" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="88,153 88,166" fill="none" stroke="#1864ab" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="202" font-size="22" font-weight="700">1. Was the skill selected?</text><text x="62" y="240" font-size="17" font-weight="400">Use a natural request without naming the skill.</text><text x="62" y="270" font-size="17" font-weight="400">Inspect loading events or invocation records.</text><text x="62" y="300" font-size="17" font-weight="400">Record unavailable evidence as unverified.</text><rect x="561" y="119" width="497" height="213" rx="14" fill="none" stroke="#862e9c" stroke-width="2"/>
<polyline points="584,144 587,147 592,140" fill="none" stroke="#862e9c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="597,144 612,144" fill="none" stroke="#862e9c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="584,155 587,158 592,151" fill="none" stroke="#862e9c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="597,155 612,155" fill="none" stroke="#862e9c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="584,166 587,169 592,162" fill="none" stroke="#862e9c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="597,166 612,166" fill="none" stroke="#862e9c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="581" y="202" font-size="22" font-weight="700">2. Did the procedure work?</text><text x="581" y="240" font-size="17" font-weight="400">Explicitly request the skill when debugging.</text><text x="581" y="270" font-size="17" font-weight="400">Check plan citations, impact, and missing input.</text><text x="581" y="300" font-size="17" font-weight="400">Inspect the response and execution trace.</text><text x="42" y="380" font-size="18" font-weight="400">A trigger heuristic checks relevance. Record actual loading evidence separately.</text></g>
