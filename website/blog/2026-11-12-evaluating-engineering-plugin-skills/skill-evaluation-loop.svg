<title id="title">Evaluate behavior, then iterate</title><desc id="desc">Keep cases stable while changing the skill. Define. Expected behavior. Scope and boundaries. Written pass criteria. Run. Positive requests. Nearby negative cases. Missing-input edge cases. Inspect. Answers and tool calls. Grader explanations. Selection evidence. Revise. Improve the skill. Challenge the graders. Repeat the comparison. Inspect failures and false passes before the next revision.</desc>
