<title id="title">What does the skill actually add?</title><desc id="desc">Change one condition; keep the comparison inputs stable. Baseline: without skills. Use --no-skills explicitly.. Same tasks, fixtures, model, tools, and graders.. Record answers and invocation evidence.. Treatment: skill available. Make the review skill available to the harness.. Repeat the same cases in fresh sessions.. Compare the evidence behind the scores.. Inspect gains, regressions, tool calls, and passing answers on both sides.</desc>
