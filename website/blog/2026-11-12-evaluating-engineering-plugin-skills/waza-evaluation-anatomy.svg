<title id="title">Anatomy of a repeatable evaluation</title><desc id="desc">Keep task inputs, skill instructions, and grading criteria distinct. Inputs. Natural task prompts. Selected sanitized fixtures. No live infrastructure needed. Execution. A discovered SKILL.md. Fresh task workspaces. An explicit no-skills baseline. Grading. Mechanical resource citations. A specific reasoning rubric. Human review of passing answers. eval.yaml connects the parts. Results and transcripts show what happened.</desc>
