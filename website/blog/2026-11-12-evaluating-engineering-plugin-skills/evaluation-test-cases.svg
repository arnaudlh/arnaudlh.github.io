<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Test the workflow and its boundaries</title><desc id="desc">Different requests need different successful outcomes. Positive: review the plan. A supplied plan changes access. and deletes a database.. Expect cited risks and checks.. Negative: nearby question. Ask how Terraform variables work.. Expect a direct syntax answer.. Check whether the skill loaded.. Edge: missing input. Ask for a review with no plan.. Expect a request for the file.. Reject invented resource findings.. Use natural requests. Keep the missing-plan workspace empty.</desc>
