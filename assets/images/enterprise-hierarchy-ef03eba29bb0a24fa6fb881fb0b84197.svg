<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="715" viewBox="0 0 1100 715" role="img" aria-labelledby="title desc">
<title id="title">An enterprise has two different kinds of team</title><desc id="desc">The enterprise owns organizations and enterprise teams. Each organization owns repositories and organization teams. The selected governance repository belongs to one organization. Enterprise teams can group users across organizations, and policy scope follows enterprise Copilot licensing rather than governance repository access.</desc>
<rect width="1100" height="715" rx="22" fill="#f5f8fc"/>
<text x="42" y="53" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#000000">An enterprise has two different kinds of team</text>
<text x="42" y="87" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#000000">Keep repository ownership separate from the audience for managed settings.</text>
